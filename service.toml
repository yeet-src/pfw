# The pfw service, four units.
#
#   keeper  (eager) holds the firewall shared worker, and the XDP hook,
#           policy and counters inside it, alive; it also serves `ctl`.
#   scrape  (lazy, per-connection) renders one exposition document per
#           request, streamed as the response body via the console portal.
#   ui      (lazy, per-connection) is the metrics app: each viewer who dials
#           /ui gets a terminal application of their own.
#   gateway binds the address and mounts the three routes.
#
#   pfw up                           # apply this service, and start it
#   curl http://127.0.0.1:9477/metrics  # the Prometheus scrape
#   pfw status                       # the control portal, over `yeet dial`
#
# This file is copied into dist/ by `make`, so paths are relative to dist/.

alias = "pfw"
restart = "on-failure:5"
enabled = true

[units.keeper]
isolate = "./index.js"
args = ["--iface", "lo"]

[units.scrape]
isolate = "./scrape.js"
lazy = true

[units.ui]
isolate = "./ui.js"
lazy = true

[units.gateway]
# Loopback: /ctl has no login, so whoever reaches this address can change the
# policy. 0.0.0.0 opens all three routes to the network; see the README first.
web-server = "http://127.0.0.1:9477"

[units.gateway.routes."/metrics"]
target = "scrape"
portal = "console"
tenancy = "per-connection"
description = "Prometheus text exposition of the firewall's counters"

[units.gateway.routes."/ctl"]
target = "keeper"
portal = "ctl"
description = "Control: status, interfaces, policy (see bin/pfw)"

[units.gateway.routes."/ui"]
target = "ui"
tenancy = "per-connection"
description = "The metrics app, for a terminal: yeet dial, or pfw metrics"
