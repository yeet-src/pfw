name: Something is not working
description: pfw does something other than what you expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If traffic is being blocked that should not be, run `pfw rollback` or `pfw clear` first: both act at once and neither stops pfw.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: The command you ran, what it printed, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: pfw doctor
      description: Paste the whole output of `pfw doctor`. It checks everything pfw depends on.
      render: text
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: pfw status
      description: Paste the output of `pfw --version` and `pfw status`.
      render: text
    validations:
      required: true
  - type: input
    id: policy
    attributes:
      label: The policy, if one is involved
      description: Its name as `pfw ls` shows it, such as rules:http/crawlers.pfc, or attach your own file.
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: How the machine is set up (a cloud VM, a container host, behind a load balancer), and whether the traffic is encrypted when it arrives.
