name: ci

# On pull requests and on pushes to master and release/*, on x86_64 and on
# arm64:
#
#   build     the service and the package, and the unit tests
#   install   the package with install.sh, as a user would
#   e2e       a real firewall: a crawler is cut off, a browser is not. On
#             loopback, through a restart of the daemon as a reboot would
#             cause; then across a pair of interfaces, from a client in a
#             network namespace of its own
#   ui        the metrics app, driven in a tmux pane
#
# on the newest runner image and an older one, so on two kernels. Then:
#
#   same-everywhere   every one of those built the same engine object, which
#                     is what lets one package serve every architecture
#   real-nic          the firewall attached to the runner's own network card
#   stranger          a blank runner and nothing but the README's one line
#
# A push to master or release/* that passes all of that, the end-to-end test
# included, is released: the
# package is published as the next version's GitHub release, which
# install.sh downloads (releases/latest/download/pfw.tar.gz).
#
# Versions are semver vMAJOR.MINOR.PATCH, as the other yeet repositories do
# it. The bump is the HIGHEST level any commit since the last release asks
# for, via a [bump:*] marker in its SUBJECT (commit-convention.yml checks
# them on pull requests):
#   * [bump:major]   -> major  (X+1.0.0)
#   * [bump:minor]   -> minor  (X.Y+1.0)
#   * [bump:patch]   -> patch  (X.Y.Z+1)
# An UNMARKED commit takes the branch default: minor on master, patch on a
# release/* maintenance branch (where you're back-patching, and a minor could
# collide with a mainline tag).

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'release/*'
  pull_request:

permissions:
  contents: read

concurrency:
  # Per ref. A newer push to a pull request supersedes the run in progress;
  # runs that may release are never cancelled.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    name: next version
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          CREATED: ${{ github.event.created }}
        run: |
          set -euo pipefail
          # Only a push to master or a release/* line releases (and a manual
          # run on one). Not a pull request, and not the push that creates a
          # branch: opening a release/* line at an existing release commit
          # has no new commits to release.
          case "${GITHUB_REF_NAME:-}" in master|release/*) on_line=true ;; *) on_line=false ;; esac
          if [ "$EVENT" = pull_request ] || [ "$on_line" = false ] || [ "$CREATED" = true ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "not a release run"
            exit 0
          fi

          # Select the baseline by tag NAME: a release/vX.Y branch sees only its
          # X.Y line, master sees all clean tags globally. Suffixed tags are
          # excluded.
          case "${GITHUB_REF_NAME:-}" in
            release/v*) default_lvl=1   # maintenance line: unmarked -> patch
                        mm="$(printf '%s' "${GITHUB_REF_NAME#release/v}" | cut -d. -f1,2 | sed 's/[.]/\\./g')"
                        tagpat="^v${mm}(\.[0-9]+)?$" ;;
            *)          default_lvl=2   # mainline: unmarked -> minor
                        tagpat='^v[0-9]+\.[0-9]+(\.[0-9]+)?$' ;;
          esac
          # `|| true` so an empty tag set (no match) doesn't fail the pipeline
          # under pipefail: that's the fresh-start case, which yields v0.1.0.
          latest="$(git tag -l 'v[0-9]*' | { grep -E "$tagpat" || true; } | sed 's/^v//' | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            next="0.1.0"
          else
            # No new commits since this line's latest release => nothing to do.
            commits="$(git rev-list "v${latest}..HEAD")"
            if [ -z "$commits" ]; then
              echo "no new commits since v${latest}: nothing to release"
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "tag=v${latest}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            maj=$(echo "$latest" | awk -F. '{print $1+0}')
            min=$(echo "$latest" | awk -F. '{print $2+0}')
            pat=$(echo "$latest" | awk -F. '{print $3+0}')   # missing patch -> 0
            rank=0   # highest level seen: 1=patch 2=minor 3=major
            while IFS= read -r sha; do
              [ -n "$sha" ] || continue
              msg="$(git log -1 --format=%s "$sha")"   # subject line only
              if   printf '%s' "$msg" | grep -qi '\[bump:major\]'; then lvl=3
              elif printf '%s' "$msg" | grep -qi '\[bump:minor\]'; then lvl=2
              elif printf '%s' "$msg" | grep -qi '\[bump:patch\]'; then lvl=1
              else lvl=$default_lvl; fi
              [ "$lvl" -gt "$rank" ] && rank=$lvl
            done <<< "$commits"
            case "$rank" in
              3) next="$((maj + 1)).0.0" ;;
              2) next="${maj}.$((min + 1)).0" ;;
              1) next="${maj}.${min}.$((pat + 1))" ;;
            esac
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "Next version: v${next}"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-latest
          - name: aarch64
            runner: ubuntu-24.04-arm
          # An older image, for an older kernel.
          - name: x86_64-older
            runner: ubuntu-22.04
          - name: aarch64-older
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    name: build, install, e2e (${{ matrix.name }})
    outputs:
      e2e: ${{ steps.login.outputs.in }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yeet
        run: |
          set -euo pipefail
          uname -srm
          # --no-phone-home: the installer otherwise reports the runner's OS
          # version on exit.
          curl -fsSL https://yeet.cx | sh -s -- --no-phone-home
          for i in $(seq 1 30); do systemctl is-active --quiet yeetd && break; sleep 1; done
          systemctl is-active yeetd
          yeet version

      - name: Build
        run: make

      - name: Unit tests, the command's tests, and the checks on docs and contrib
        run: make test

      - name: The alert rules, as Prometheus reads them
        if: matrix.name == 'x86_64'
        run: |
          docker run --rm -v "$PWD/contrib/prometheus:/rules:ro" --entrypoint promtool \
            prom/prometheus:latest check rules /rules/alerts.yml

      - name: Package
        run: |
          set -euo pipefail
          # Stamped with the version this run will release as, or `dev`.
          make pkg PKG_VERSION="${{ needs.version.outputs.tag }}"
          tar -tzf pkg/pfw.tar.gz
          sha256sum dist/bin/vm.bpf.o | cut -d ' ' -f 1 > vm.bpf.o.sha256
          cat vm.bpf.o.sha256

      # yeet serves a login page in place of every route of a host that is not
      # logged in, so driving a firewall takes a login. A key in the
      # YEET_API_KEY secret gives the runner one. A pull request from a fork
      # has no secrets: it installs and stops there.
      - name: Is there a key to log in with?
        id: login
        env:
          YEET_API_KEY: ${{ secrets.YEET_API_KEY }}
        run: |
          if [ -z "$YEET_API_KEY" ]; then
            echo "::warning::no YEET_API_KEY secret, so the firewall cannot be driven here: the end-to-end tests are skipped, and nothing is released"
            echo "in=false" >> "$GITHUB_OUTPUT"
          else
            echo "in=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install, as a user would
        env:
          YEET_API_KEY: ${{ secrets.YEET_API_KEY }}
          LOGGED_IN: ${{ steps.login.outputs.in }}
        run: |
          set -euo pipefail
          # From outside the checkout, so install.sh installs the package and
          # does not build. It logs in with the key itself.
          cp install.sh "$RUNNER_TEMP/install.sh"
          cd "$RUNNER_TEMP"
          if [ "$LOGGED_IN" = true ]; then
            sh ./install.sh --package "$GITHUB_WORKSPACE/pkg/pfw.tar.gz"
          else
            sh ./install.sh --package "$GITHUB_WORKSPACE/pkg/pfw.tar.gz" --no-login --no-up
          fi
          command -v pfw
          pfw --version
          # Tab completion came with it, and completes.
          test -f /usr/local/share/bash-completion/completions/pfw
          test -f /usr/local/share/zsh/site-functions/_pfw
          bash -c 'source /usr/local/share/bash-completion/completions/pfw; COMP_LINE="pfw roll" COMP_POINT=8; _pfw; [ "${COMPREPLY[0]}" = rollback ]'

      - name: End to end, on loopback, through a restart of the daemon
        if: steps.login.outputs.in == 'true'
        env:
          E2E_DAEMON_RESTART: yes
        run: make e2e

      - name: The metrics app
        if: steps.login.outputs.in == 'true'
        run: |
          set -euo pipefail
          command -v tmux >/dev/null 2>&1 || sudo apt-get install -y -qq tmux >/dev/null
          pfw up
          sh test/ui.sh

      - name: End to end, across an interface
        if: steps.login.outputs.in == 'true'
        env:
          E2E_ON: veth
        run: make e2e

      - name: What the service says, if that failed
        if: failure()
        run: |
          pfw doctor || true
          yeet service tree || true
          yeet ps || true
          ip -d link || true
          sudo journalctl -u yeetd --no-pager -n 200 || true

      - name: Log this runner out
        if: always() && steps.login.outputs.in == 'true'
        run: yeet logout || true

      - uses: actions/upload-artifact@v4
        with:
          name: object-${{ matrix.name }}
          path: vm.bpf.o.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'x86_64'
        with:
          name: package
          path: pkg/pfw.tar.gz
          if-no-files-found: error

  same-everywhere:
    needs: build
    runs-on: ubuntu-latest
    name: one engine object for every architecture
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: object-*
      - run: |
          set -euo pipefail
          grep . object-*/vm.bpf.o.sha256
          [ "$(cat object-*/vm.bpf.o.sha256 | sort -u | wc -l)" -eq 1 ] || {
            echo "::error::the engine object differs between builds, so one package cannot serve them all"
            exit 1
          }

  # The firewall on the runner's own network card, the one its traffic to the
  # world goes through, with a policy enforcing: the card must take the XDP
  # program and the runner must still reach the network. It does not gate a
  # release: a hosted runner's card is not ours to vouch for.
  real-nic:
    needs: build
    if: needs.build.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    name: the runner's own network card
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: pkg
      - name: Install yeet and pfw
        env:
          YEET_API_KEY: ${{ secrets.YEET_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install.sh" -o install.sh
          sh ./install.sh --package pkg/pfw.tar.gz --no-phone-home
      - name: Attach to the card the default route uses
        run: |
          set -euo pipefail
          nic=$(ip -o route show default | sed -n 's/.* dev \([^ ]*\).*/\1/p' | head -n 1)
          echo "the default route is through $nic"
          ip -d link show "$nic"
          pfw attach "$nic"
          pfw detach lo
          pfw pull
          pfw apply rules:http/crawlers.pfc
          # The runner still reaches the world through it, and pfw is seeing that.
          curl -fsS -m 20 -o /dev/null https://github.com
          curl -fsS -m 20 -o /dev/null http://example.com
          sleep 2
          pfw status
          pfw --json status | grep -q "\"seen\":[1-9]" || { echo "::error::pfw saw no packets on $nic"; exit 1; }
          ip link show "$nic" | grep -q xdp
          pfw metrics | head -20
      - name: Let go of it
        if: always()
        run: |
          pfw down || true
          yeet logout || true

  release:
    needs: [version, build, same-everywhere]
    # Only what ran end to end is released.
    if: needs.version.outputs.release == 'true' && needs.build.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    name: release ${{ needs.version.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: pkg
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # The newest MAINLINE version is GitHub's "Latest", which is what
          # .../releases/latest/download/pfw.tar.gz and so install.sh track.
          # A release/* back-port must not take that from a newer mainline
          # release, so it publishes with --latest=false.
          if [ "${GITHUB_REF_NAME}" = master ]; then mk=--latest; else mk='--latest=false'; fi
          gh release create "$TAG" pkg/pfw.tar.gz \
            --title "pfw ${TAG#v}" \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            "$mk"

  # A machine with nothing on it and the one line the README gives, which
  # installs yeet, logs in, downloads the latest release and starts the
  # firewall. Then the same end-to-end test, against what that installed. It
  # runs after `release`, so on master it is the release just published.
  stranger:
    needs: [build, release]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.e2e == 'true' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    name: a blank machine and the README's one line
    steps:
      - name: Nothing is installed yet
        run: |
          ! command -v yeet
          ! command -v pfw
      # With no release from this run (a pull request), the latest release
      # is an older pfw than the test below is written for: the one line
      # then installs this run's package, by way of PFW_PACKAGE.
      - uses: actions/download-artifact@v4
        if: needs.release.result == 'skipped'
        with:
          name: package
          path: pkg
      - name: Which package the one line installs
        run: |
          if [ -f pkg/pfw.tar.gz ]; then echo "PFW_PACKAGE=$PWD/pkg/pfw.tar.gz" >> "$GITHUB_ENV"; fi
      - name: The one line
        env:
          YEET_API_KEY: ${{ secrets.YEET_API_KEY }}
        # --no-phone-home, here and wherever CI installs yeet: its installer
        # otherwise reports the runner's OS version on exit. It is the one
        # thing this adds to the README's line.
        run: curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install.sh" | sh -s -- --no-phone-home
      - name: What it installed
        run: |
          set -euo pipefail
          yeet version
          pfw --version
          pfw doctor
          pfw status
      - uses: actions/checkout@v4
      - name: End to end, against it
        run: sh test/e2e.sh
      - name: Upgrade
        run: |
          set -euo pipefail
          pfw up
          pfw pull
          pfw apply rules:http/crawlers.pfc
          # A release from this run is the latest, and pfw knows it has it.
          if [ -z "${PFW_PACKAGE:-}" ]; then pfw upgrade | grep 'is the latest release'; fi
          # Installed again over itself, the firewall comes back as it was.
          pfw upgrade --force
          pfw status
          pfw status | grep -q 'rules:http/crawlers.pfc'
      - name: Uninstall
        run: |
          set -euo pipefail
          if pfw uninstall </dev/null; then echo "::error::uninstall did not ask"; exit 1; fi
          command -v pfw
          pfw uninstall --yes --purge
          ! command -v pfw
          ! test -e /usr/local/share/pfw
          ! test -e /var/lib/pfw
          ! test -e /usr/local/share/bash-completion/completions/pfw
          ! test -e "$HOME/.config/pfw"
          ! test -e "$HOME/.cache/pfw"
          ! yeet service list | grep -qw pfw
          ! ip link show lo | grep -q xdp
          yeet version
      - name: What the service says, if that failed
        if: failure()
        run: |
          pfw doctor || true
          yeet service tree || true
          sudo journalctl -u yeetd --no-pager -n 100 || true
      - name: Log this runner out
        if: always()
        run: yeet logout || true
